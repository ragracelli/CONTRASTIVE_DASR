<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Reconhecimento Automático de Fala Disártrica com Aprendizado Contrastivo – Áudios e Códigos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      display: flex;
      flex-direction: row;
      padding: 20px;
    }
    section {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      max-height: 90vh;
    }
    h2 {
      margin-top: 20px;
    }
    .audio-group {
      margin-bottom: 20px;
    }
    audio {
      display: block;
      margin: 5px 0;
    }
    button {
      margin-top: 10px;
      display: block;
    }
    pre {
      display: none;
      background: #f4f4f4;
      padding: 10px;
      border: 1px solid #ccc;
      white-space: pre-wrap;
    }
    #audioContainer h2 {
      color: #2c3e50;
    }
    #codeContainer h2 {
      color: #8e44ad;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔊 CONTRASTIVE_DASR – Áudios e Códigos</h1>
  </header>

  <main>
    <!-- Áudios à esquerda -->
    <section id="audioContainer">
      <h2>Áudios por Nível</h2>
      <p>Carregando áudios...</p>
    </section>

    <!-- Códigos à direita -->
    <section id="codeContainer">
      <h2>Códigos do Repositório</h2>
      <p>Carregando códigos...</p>
    </section>
  </main>

  <script>
    const repoOwner = 'ragracelli';
    const repoName = 'CONTRASTIVE_DASR';
    const audioPath = 'wav_samples';
    const codePath = ''; // raiz do repositório

    const rawBaseURL = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${audioPath}`;
    const audioApiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${audioPath}`;
    const codeApiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${codePath}`;

    const audioContainer = document.getElementById('audioContainer');
    const codeContainer = document.getElementById('codeContainer');

    // 🎵 Buscar áudios por diretório
    async function fetchAudioFiles() {
      audioContainer.innerHTML = '<h2>Áudios por Nível</h2>';

      try {
        const res = await fetch(audioApiURL);
        const folders = await res.json();

        for (const folder of folders) {
          if (folder.type === 'dir') {
            const folderName = folder.name;
            const folderRes = await fetch(folder.url);
            const files = await folderRes.json();

            const group = document.createElement('div');
            group.className = 'audio-group';
            group.innerHTML = `<h3>${folderName}</h3>`;

            files.forEach(file => {
              if (file.name.endsWith('.wav')) {
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = `${rawBaseURL}/${folderName}/${file.name}`;
                const label = document.createElement('p');
                label.textContent = file.name;
                group.appendChild(label);
                group.appendChild(audio);
              }
            });

            audioContainer.appendChild(group);
          }
        }
      } catch (error) {
        audioContainer.innerHTML = 'Erro ao carregar os áudios.';
        console.error(error);
      }
    }

    // 📄 Buscar e exibir códigos
    async function fetchCodeFiles() {
      codeContainer.innerHTML = '<h2>Códigos do Repositório</h2>';

      try {
        const res = await fetch(codeApiURL);
        const files = await res.json();

        files.forEach(file => {
          if (file.name.endsWith('.py') || file.name.endsWith('.sh')) {
            const button = document.createElement('button');
            button.textContent = `Ver ${file.name}`;

            const codeBlock = document.createElement('pre');

            button.onclick = async () => {
              if (codeBlock.textContent === '') {
                const fileRes = await fetch(file.download_url);
                const text = await fileRes.text();
                codeBlock.textContent = text;
              }
              codeBlock.style.display = codeBlock.style.display === 'none' ? 'block' : 'none';
            };

            codeContainer.appendChild(button);
            codeContainer.appendChild(codeBlock);
          }
        });
      } catch (error) {
        codeContainer.innerHTML = 'Erro ao carregar os códigos.';
        console.error(error);
      }
    }

    fetchAudioFiles();
    fetchCodeFiles();
  </script>
</body>
</html>
